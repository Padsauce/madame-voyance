<title>Madame Voyance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0616">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&family=Noto+Sans+Runic&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&text=%E9%BC%A0%E7%89%9B%E8%99%8E%E5%85%94%E9%BE%8D%E8%9B%87%E9%A6%AC%E7%BE%8A%E7%8C%B4%E9%9B%9E%E7%8B%97%E8%B1%AC&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Mise en page : application mobile à une colonne (max 520px), barre d'onglets fixe en bas, ciel étoilé animé derrière tout. */
:root{
  --night:#0a0616;
  --night-2:#140b2b;
  --velvet:#1f1340;
  --velvet-2:#2c1b55;
  --violet:#a77dff;
  --violet-glow:rgba(167,125,255,.42);
  --gold:#e6c378;
  --gold-hi:#fbe9b7;
  --gold-lo:#9b783a;
  --gold-line:rgba(230,195,120,.5);
  --gold-faint:rgba(230,195,120,.16);
  --ink:#f2ecff;
  --mist:#b9abda;
  --dim:#8a7cad;
  --ok:#a8e8c3;
  --danger:#ff9aa8;

  --f-display:'Cinzel','Trajan Pro',Georgia,serif;
  --f-read:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --f-ui:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-sym:'Noto Sans Symbols','Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols',serif;
  --f-rune:'Noto Sans Runic','Segoe UI Historic',serif;
  --f-cjk:'Noto Serif SC','Songti SC','SimSun',serif;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;background:var(--night);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ---- Ciel ---- */
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 45% at 15% 8%, rgba(120,70,220,.38), transparent 70%),
  radial-gradient(55% 40% at 95% 55%, rgba(170,60,170,.20), transparent 70%),
  radial-gradient(70% 50% at 40% 105%, rgba(70,40,160,.35), transparent 70%),
  linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%)}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:60}

/* ---- Structure ---- */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px calc(104px + env(safe-area-inset-bottom, 0px))}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .5s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand-mini{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--gold-line);background:rgba(20,11,43,.7);font-size:13px;font-weight:500;color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .sep{width:1px;height:12px;background:var(--gold-line)}
.chip svg{width:14px;height:14px}

.h-eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.h-title{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.04em;margin:4px 0 0;text-wrap:balance}
.gold{background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--violet-glow))}
.lead{font-family:var(--f-read);font-size:19px;line-height:1.45;color:var(--ink)}
.muted{color:var(--mist)}
.small{font-size:13px}

/* ---- Cadre doré ---- */
.frame{position:relative;border:1px solid var(--gold-line);border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(44,27,85,.78),rgba(20,11,43,.86));
  box-shadow:0 0 0 4px rgba(10,6,22,.55),0 0 0 5px var(--gold-faint),0 18px 50px -18px var(--violet-glow);
  padding:24px 20px 20px}
.frame::before{content:"✦";position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:0 10px;font-size:14px;line-height:20px;color:var(--gold);background:var(--night-2);border-radius:10px}
.frame-plain{border:1px solid var(--gold-faint);border-radius:var(--r-md);background:rgba(28,17,58,.66);padding:16px}

/* ---- Boutons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:500;letter-spacing:.02em;transition:transform .15s ease, box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#c99f4c);color:#25153f;font-weight:600;box-shadow:0 0 0 1px rgba(255,240,200,.4) inset,0 8px 26px -8px rgba(230,195,120,.7)}
.btn-ghost{border:1px solid var(--gold-line);color:var(--gold-hi);background:rgba(20,11,43,.6)}
.btn-ghost:hover{box-shadow:0 0 18px -4px var(--violet-glow)}
.btn-danger{border:1px solid rgba(255,154,168,.5);color:var(--danger);background:rgba(60,10,30,.35)}
.btn-wide{width:100%}
.pts{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(37,21,63,.18);font-variant-numeric:tabular-nums}
.btn-ghost .pts{background:var(--gold-faint);color:var(--gold-hi)}

/* ---- Segments ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--gold-faint);background:rgba(20,11,43,.72)}
.seg button{min-height:40px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mist);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(167,125,255,.35),rgba(167,125,255,.15));color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-line) inset,0 0 16px -4px var(--violet-glow)}

/* ---- Accueil ---- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:10px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,40px);letter-spacing:.08em;line-height:1.05;margin:0}
.wordmark small{display:block;font-size:.42em;letter-spacing:.5em;font-weight:500;margin-bottom:6px}
.date-line{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:14px}
.date-line .dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.greet{font-family:var(--f-read);font-size:21px;font-style:italic;color:var(--ink)}
.thought{font-family:var(--f-read);font-style:italic;font-weight:500;font-size:clamp(22px,6vw,26px);line-height:1.35;text-align:center;margin:8px 0 18px;text-wrap:balance}
.thought-foot{display:flex;justify-content:center}
.done-note{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-size:14px}

.rituals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rit{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:54px;border-radius:var(--r-md);border:1px solid var(--gold-faint);background:rgba(28,17,58,.66);text-align:left;transition:border-color .2s, box-shadow .2s}
.rit:hover{border-color:var(--gold-line)}
.rit .g{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold-line);font-family:var(--f-display),var(--f-sym),var(--f-rune);font-size:13px;color:var(--gold)}
.rit .t{flex:1;min-width:0;font-size:13px;line-height:1.25}
.rit .p{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.rit.done{border-color:rgba(168,232,195,.35);background:rgba(30,60,55,.28)}
.rit.done .g{border-color:rgba(168,232,195,.6);color:var(--ok)}
.rit.done .p{color:var(--ok)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-head h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.count{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}

.levelbar{display:flex;flex-direction:column;gap:8px}
.lv-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lv-name{font-family:var(--f-display);font-size:16px;color:var(--gold-hi)}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid var(--gold-faint)}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--gold));box-shadow:0 0 12px var(--violet-glow)}

/* ---- Cartes de tarot ---- */
.deck-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.spread{display:grid;gap:10px;justify-content:center;width:100%}
.spread.n1{grid-template-columns:min(220px,62vw)}
.spread.n3{grid-template-columns:repeat(3,minmax(0,124px))}
.spread.n10{grid-template-columns:repeat(5,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.slot-label{font-size:11px;letter-spacing:.06em;color:var(--mist);text-align:center;line-height:1.2}
.n10 .slot-label{font-size:10px}
.tcard{display:block;width:100%;aspect-ratio:7/12;perspective:900px;border-radius:12px}
.tc-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.tcard.flipped .tc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{transform:rotateY(180deg);background:#f3ead2;border:2px solid var(--gold)}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front .fallback{display:none}
.face.front.noimg{display:grid;place-items:center;background:linear-gradient(180deg,var(--velvet-2),var(--night-2));padding:8px;text-align:center}
.face.front.noimg img{display:none}
.face.front.noimg .fallback{display:block;font-family:var(--f-display);color:var(--gold-hi);font-size:13px}
.tcard:not(.flipped){animation:hover-card 4s ease-in-out infinite}
.slot:nth-child(odd) .tcard:not(.flipped){animation-delay:-2s}
@keyframes hover-card{50%{transform:translateY(-4px)}}

/* Dos de cartes */
.back{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(10,6,22,.8) inset,0 0 0 4px var(--gold-line) inset}
.back-nuit{background:radial-gradient(circle at 50% 50%,rgba(230,195,120,.28) 0 14%,transparent 15%),radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(230,195,120,.35) 30.5% 31.5%,transparent 32%),radial-gradient(1px 1px at 20% 25%,#fff8 99%,transparent),radial-gradient(1px 1px at 75% 18%,#fff9 99%,transparent),radial-gradient(1px 1px at 30% 80%,#fff7 99%,transparent),radial-gradient(1px 1px at 82% 72%,#fff8 99%,transparent),linear-gradient(160deg,#2b1760,#120a2a)}
.back-lune{background:radial-gradient(circle at 57% 41%,#1c1046 0 21%,transparent 22%),radial-gradient(circle at 46% 47%,var(--gold) 0 22%,transparent 23%),repeating-radial-gradient(circle at 50% 50%,transparent 0 9px,rgba(230,195,120,.12) 9px 10px),linear-gradient(160deg,#241052,#0e0722)}
.back-soleil{background:radial-gradient(circle at 50% 50%,var(--gold-hi) 0 12%,var(--gold) 13% 16%,transparent 17%),repeating-conic-gradient(from 0deg at 50% 50%,rgba(230,195,120,.42) 0 4deg,transparent 4deg 15deg),linear-gradient(160deg,#3b1650,#160a2c)}
.back-astres{background:radial-gradient(1.5px 1.5px at 22% 30%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 40% 22%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 58% 38%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 72% 26%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 30% 68%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 52% 78%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 70% 64%,var(--gold-hi) 99%,transparent),linear-gradient(155deg,transparent 46%,rgba(230,195,120,.35) 46.5% 47%,transparent 47.5%),linear-gradient(25deg,transparent 52%,rgba(230,195,120,.3) 52.5% 53%,transparent 53.5%),linear-gradient(160deg,#1a1d5c,#0b0820)}

.tap-hint{font-size:13px;color:var(--mist);letter-spacing:.04em;text-align:center}
.reading{display:flex;flex-direction:column;gap:12px}
.read-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border-radius:var(--r-md);border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);text-align:left;width:100%}
.read-row img,.read-row .thumb{width:52px;aspect-ratio:7/12;border-radius:6px;object-fit:cover;border:1px solid var(--gold-line);background:var(--velvet)}
.pos{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.cname{font-family:var(--f-display);font-size:16px;color:var(--gold-hi);margin:2px 0}
.keys{font-size:12px;letter-spacing:.04em;color:var(--mist)}
.msg{font-family:var(--f-read);font-size:18px;line-height:1.4;margin-top:6px}
.daily-read{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.daily-read .cname{font-size:22px}
.tip{display:inline-flex;gap:8px;align-items:flex-start;text-align:left;padding:10px 14px;border-radius:12px;background:rgba(167,125,255,.12);border:1px solid rgba(167,125,255,.3);font-size:14px}

/* ---- Astres ---- */
.sign-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.glyph-orb{width:112px;height:112px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold-line);background:radial-gradient(circle at 50% 40%,rgba(167,125,255,.35),rgba(20,11,43,.4) 70%);box-shadow:0 0 0 6px rgba(10,6,22,.5),0 0 0 7px var(--gold-faint),0 0 40px -6px var(--violet-glow)}
.glyph-orb span{font-family:var(--f-sym);font-size:54px;line-height:1;color:var(--gold-hi);text-shadow:0 0 18px var(--violet-glow)}
.glyph-orb .cjk{font-family:var(--f-cjk);font-size:58px;font-weight:600}
.glyph-orb .num{font-family:var(--f-display);font-size:50px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.fact{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--gold-faint);color:var(--mist)}
.horo{display:flex;flex-direction:column;gap:14px}
.horo-item{display:flex;flex-direction:column;gap:2px}
.horo-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.horo-head b{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.stars{letter-spacing:3px;color:var(--gold);font-size:13px}
.stars .off{color:rgba(230,195,120,.25)}
.signs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.signs button{min-height:44px;border-radius:12px;border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);font-family:var(--f-sym);font-size:20px;color:var(--gold)}
.signs button[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 14px -4px var(--violet-glow)}
.moon-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.moon-wrap svg{width:min(170px,46vw);height:auto;filter:drop-shadow(0 0 26px rgba(240,230,200,.35))}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.stat{padding:10px 6px;border-radius:12px;border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:17px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mist);line-height:1.2;display:block}

/* ---- Oracles ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px;min-height:132px;border-radius:var(--r-lg);border:1px solid var(--gold-faint);background:linear-gradient(170deg,rgba(44,27,85,.75),rgba(20,11,43,.8));text-align:left;overflow:hidden;transition:border-color .2s, box-shadow .2s}
.tile:hover{border-color:var(--gold-line);box-shadow:0 0 24px -8px var(--violet-glow)}
.tile.wide{grid-column:1 / -1;padding-right:58px;min-height:auto;flex-direction:row;align-items:center}
.tile .tg{font-size:30px;line-height:1;color:var(--gold);text-shadow:0 0 14px var(--violet-glow);font-family:var(--f-display),var(--f-sym),var(--f-rune)}
.tile .tn{font-family:var(--f-display);font-size:15px;color:var(--gold-hi);letter-spacing:.04em}
.tile .td{font-size:12px;color:var(--mist);line-height:1.35}
.tile .badge{position:absolute;top:10px;right:10px}
.tile.wide .grow{flex:1;min-width:0}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gold-faint);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.badge.ok{background:rgba(168,232,195,.15);color:var(--ok)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--mist);font-size:14px;min-height:40px;align-self:flex-start}
.back-link svg{width:16px;height:16px}

.num-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rune-stone{width:120px;height:140px;display:grid;place-items:center;border-radius:46% 54% 48% 52% / 50% 46% 54% 50%;background:radial-gradient(circle at 35% 30%,#6b6188,#3a3254 60%,#241d38);box-shadow:inset -8px -10px 18px rgba(0,0,0,.45),inset 6px 6px 14px rgba(255,255,255,.12),0 14px 30px -10px rgba(0,0,0,.6),0 0 40px -10px var(--violet-glow)}
.rune-stone span{font-family:var(--f-rune);font-size:64px;color:var(--gold);text-shadow:0 0 12px rgba(230,195,120,.7),0 1px 0 rgba(0,0,0,.6)}
.pouch{width:120px;height:140px;display:grid;place-items:center;border-radius:40% 40% 46% 46% / 30% 30% 60% 60%;background:radial-gradient(circle at 40% 35%,#5a2f7a,#2a1446 70%);border:1px solid var(--gold-line);box-shadow:0 0 30px -6px var(--violet-glow);font-family:var(--f-rune);font-size:28px;color:var(--gold)}
.gem{width:96px;height:96px;clip-path:polygon(50% 0,92% 30%,78% 100%,22% 100%,8% 30%);box-shadow:none}
.swatch{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold-line);box-shadow:0 0 30px -6px var(--violet-glow)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duo>div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.lucky{font-family:var(--f-display);font-size:44px;color:var(--gold-hi);line-height:1}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.field input{min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--gold-line);background:rgba(10,6,22,.6);font-size:16px;color:var(--ink);width:100%}
.field input{display:block;min-width:0;max-width:100%;height:50px;margin:0;-webkit-appearance:none;appearance:none}
.field input[type=date]{line-height:48px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
