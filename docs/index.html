<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Votre voyance du jour : tarot, horoscope, lune, runes et numérologie.">
<link rel="manifest" href="manifest.webmanifest">
<style>html{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Madame Voyance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0a0616">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&family=Noto+Sans+Runic&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&text=%E9%BC%A0%E7%89%9B%E8%99%8E%E5%85%94%E9%BE%8D%E8%9B%87%E9%A6%AC%E7%BE%8A%E7%8C%B4%E9%9B%9E%E7%8B%97%E8%B1%AC&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Mise en page : application mobile à une colonne (max 520px), barre d'onglets fixe en bas, ciel étoilé animé derrière tout. */
:root{
  --night:#0a0616;
  --night-2:#140b2b;
  --velvet:#1f1340;
  --velvet-2:#2c1b55;
  --violet:#a77dff;
  --violet-glow:rgba(167,125,255,.42);
  --gold:#e6c378;
  --gold-hi:#fbe9b7;
  --gold-lo:#9b783a;
  --gold-line:rgba(230,195,120,.5);
  --gold-faint:rgba(230,195,120,.16);
  --ink:#f2ecff;
  --mist:#b9abda;
  --dim:#8a7cad;
  --ok:#a8e8c3;
  --danger:#ff9aa8;

  --f-display:'Cinzel','Trajan Pro',Georgia,serif;
  --f-read:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --f-ui:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-sym:'Noto Sans Symbols','Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols',serif;
  --f-rune:'Noto Sans Runic','Segoe UI Historic',serif;
  --f-cjk:'Noto Serif SC','Songti SC','SimSun',serif;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;background:var(--night);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ---- Ciel ---- */
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 45% at 15% 8%, rgba(120,70,220,.38), transparent 70%),
  radial-gradient(55% 40% at 95% 55%, rgba(170,60,170,.20), transparent 70%),
  radial-gradient(70% 50% at 40% 105%, rgba(70,40,160,.35), transparent 70%),
  linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%)}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:60}

/* ---- Structure ---- */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px calc(104px + env(safe-area-inset-bottom, 0px))}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .5s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand-mini{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--gold-line);background:rgba(20,11,43,.7);font-size:13px;font-weight:500;color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .sep{width:1px;height:12px;background:var(--gold-line)}
.chip svg{width:14px;height:14px}

.h-eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.h-title{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:.04em;margin:4px 0 0;text-wrap:balance}
.gold{background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 55%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--violet-glow))}
.lead{font-family:var(--f-read);font-size:19px;line-height:1.45;color:var(--ink)}
.muted{color:var(--mist)}
.small{font-size:13px}

/* ---- Cadre doré ---- */
.frame{position:relative;border:1px solid var(--gold-line);border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(44,27,85,.78),rgba(20,11,43,.86));
  box-shadow:0 0 0 4px rgba(10,6,22,.55),0 0 0 5px var(--gold-faint),0 18px 50px -18px var(--violet-glow);
  padding:24px 20px 20px}
.frame::before{content:"✦";position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:0 10px;font-size:14px;line-height:20px;color:var(--gold);background:var(--night-2);border-radius:10px}
.frame-plain{border:1px solid var(--gold-faint);border-radius:var(--r-md);background:rgba(28,17,58,.66);padding:16px}

/* ---- Boutons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:500;letter-spacing:.02em;transition:transform .15s ease, box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#c99f4c);color:#25153f;font-weight:600;box-shadow:0 0 0 1px rgba(255,240,200,.4) inset,0 8px 26px -8px rgba(230,195,120,.7)}
.btn-ghost{border:1px solid var(--gold-line);color:var(--gold-hi);background:rgba(20,11,43,.6)}
.btn-ghost:hover{box-shadow:0 0 18px -4px var(--violet-glow)}
.btn-danger{border:1px solid rgba(255,154,168,.5);color:var(--danger);background:rgba(60,10,30,.35)}
.btn-wide{width:100%}
.pts{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(37,21,63,.18);font-variant-numeric:tabular-nums}
.btn-ghost .pts{background:var(--gold-faint);color:var(--gold-hi)}

/* ---- Segments ---- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--gold-faint);background:rgba(20,11,43,.72)}
.seg button{min-height:40px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mist);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(167,125,255,.35),rgba(167,125,255,.15));color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-line) inset,0 0 16px -4px var(--violet-glow)}

/* ---- Accueil ---- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:10px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,40px);letter-spacing:.08em;line-height:1.05;margin:0}
.wordmark small{display:block;font-size:.42em;letter-spacing:.5em;font-weight:500;margin-bottom:6px}
.date-line{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:14px}
.date-line .dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.greet{font-family:var(--f-read);font-size:21px;font-style:italic;color:var(--ink)}
.thought{font-family:var(--f-read);font-style:italic;font-weight:500;font-size:clamp(22px,6vw,26px);line-height:1.35;text-align:center;margin:8px 0 18px;text-wrap:balance}
.thought-foot{display:flex;justify-content:center}
.done-note{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-size:14px}

.rituals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rit{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:54px;border-radius:var(--r-md);border:1px solid var(--gold-faint);background:rgba(28,17,58,.66);text-align:left;transition:border-color .2s, box-shadow .2s}
.rit:hover{border-color:var(--gold-line)}
.rit .g{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold-line);font-family:var(--f-display),var(--f-sym),var(--f-rune);font-size:13px;color:var(--gold)}
.rit .t{flex:1;min-width:0;font-size:13px;line-height:1.25}
.rit .p{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.rit.done{border-color:rgba(168,232,195,.35);background:rgba(30,60,55,.28)}
.rit.done .g{border-color:rgba(168,232,195,.6);color:var(--ok)}
.rit.done .p{color:var(--ok)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-head h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.count{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}

.levelbar{display:flex;flex-direction:column;gap:8px}
.lv-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lv-name{font-family:var(--f-display);font-size:16px;color:var(--gold-hi)}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid var(--gold-faint)}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--gold));box-shadow:0 0 12px var(--violet-glow)}

/* ---- Cartes de tarot ---- */
.deck-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.spread{display:grid;gap:10px;justify-content:center;width:100%}
.spread.n1{grid-template-columns:min(220px,62vw)}
.spread.n3{grid-template-columns:repeat(3,minmax(0,124px))}
.spread.n10{grid-template-columns:repeat(5,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.slot-label{font-size:11px;letter-spacing:.06em;color:var(--mist);text-align:center;line-height:1.2}
.n10 .slot-label{font-size:10px}
.tcard{display:block;width:100%;aspect-ratio:7/12;perspective:900px;border-radius:12px}
.tc-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.tcard.flipped .tc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{transform:rotateY(180deg);background:#f3ead2;border:2px solid var(--gold);box-shadow:0 0 24px -4px var(--violet-glow)}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.front .fallback{display:none}
.face.front.noimg{display:grid;place-items:center;background:linear-gradient(180deg,var(--velvet-2),var(--night-2));padding:8px;text-align:center}
.face.front.noimg img{display:none}
.face.front.noimg .fallback{display:block;font-family:var(--f-display);color:var(--gold-hi);font-size:13px}
.tcard:not(.flipped) .tc-inner{animation:hover-card 4s ease-in-out infinite}
.slot:nth-child(odd) .tcard:not(.flipped) .tc-inner{animation-delay:-2s}
@keyframes hover-card{50%{transform:translateY(-4px)}}

/* Dos de cartes */
.back{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(10,6,22,.8) inset,0 0 0 4px var(--gold-line) inset,0 0 22px -4px var(--violet-glow)}
.back-nuit{background:radial-gradient(circle at 50% 50%,rgba(230,195,120,.28) 0 14%,transparent 15%),radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(230,195,120,.35) 30.5% 31.5%,transparent 32%),radial-gradient(1px 1px at 20% 25%,#fff8 99%,transparent),radial-gradient(1px 1px at 75% 18%,#fff9 99%,transparent),radial-gradient(1px 1px at 30% 80%,#fff7 99%,transparent),radial-gradient(1px 1px at 82% 72%,#fff8 99%,transparent),linear-gradient(160deg,#2b1760,#120a2a)}
.back-lune{background:radial-gradient(circle at 57% 41%,#1c1046 0 21%,transparent 22%),radial-gradient(circle at 46% 47%,var(--gold) 0 22%,transparent 23%),repeating-radial-gradient(circle at 50% 50%,transparent 0 9px,rgba(230,195,120,.12) 9px 10px),linear-gradient(160deg,#241052,#0e0722)}
.back-soleil{background:radial-gradient(circle at 50% 50%,var(--gold-hi) 0 12%,var(--gold) 13% 16%,transparent 17%),repeating-conic-gradient(from 0deg at 50% 50%,rgba(230,195,120,.42) 0 4deg,transparent 4deg 15deg),linear-gradient(160deg,#3b1650,#160a2c)}
.back-astres{background:radial-gradient(1.5px 1.5px at 22% 30%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 40% 22%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 58% 38%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 72% 26%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 30% 68%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 52% 78%,var(--gold-hi) 99%,transparent),radial-gradient(1.5px 1.5px at 70% 64%,var(--gold-hi) 99%,transparent),linear-gradient(155deg,transparent 46%,rgba(230,195,120,.35) 46.5% 47%,transparent 47.5%),linear-gradient(25deg,transparent 52%,rgba(230,195,120,.3) 52.5% 53%,transparent 53.5%),linear-gradient(160deg,#1a1d5c,#0b0820)}

.tap-hint{font-size:13px;color:var(--mist);letter-spacing:.04em;text-align:center}
.reading{display:flex;flex-direction:column;gap:12px}
.read-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;padding:12px;border-radius:var(--r-md);border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);text-align:left;width:100%}
.read-row img,.read-row .thumb{width:52px;aspect-ratio:7/12;border-radius:6px;object-fit:cover;border:1px solid var(--gold-line);background:var(--velvet)}
.pos{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
.cname{font-family:var(--f-display);font-size:16px;color:var(--gold-hi);margin:2px 0}
.keys{font-size:12px;letter-spacing:.04em;color:var(--mist)}
.msg{font-family:var(--f-read);font-size:18px;line-height:1.4;margin-top:6px}
.daily-read{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.daily-read .cname{font-size:22px}
.tip{display:inline-flex;gap:8px;align-items:flex-start;text-align:left;padding:10px 14px;border-radius:12px;background:rgba(167,125,255,.12);border:1px solid rgba(167,125,255,.3);font-size:14px}

/* ---- Astres ---- */
.sign-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.glyph-orb{width:112px;height:112px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold-line);background:radial-gradient(circle at 50% 40%,rgba(167,125,255,.35),rgba(20,11,43,.4) 70%);box-shadow:0 0 0 6px rgba(10,6,22,.5),0 0 0 7px var(--gold-faint),0 0 40px -6px var(--violet-glow)}
.glyph-orb span{font-family:var(--f-sym);font-size:54px;line-height:1;color:var(--gold-hi);text-shadow:0 0 18px var(--violet-glow)}
.glyph-orb .cjk{font-family:var(--f-cjk);font-size:58px;font-weight:600}
.glyph-orb .num{font-family:var(--f-display);font-size:50px;font-weight:600}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.fact{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--gold-faint);color:var(--mist)}
.horo{display:flex;flex-direction:column;gap:14px}
.horo-item{display:flex;flex-direction:column;gap:2px}
.horo-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.horo-head b{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.stars{letter-spacing:3px;color:var(--gold);font-size:13px}
.stars .off{color:rgba(230,195,120,.25)}
.signs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.signs button{min-height:44px;border-radius:12px;border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);font-family:var(--f-sym);font-size:20px;color:var(--gold)}
.signs button[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 14px -4px var(--violet-glow)}
.moon-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.moon-wrap svg{width:min(170px,46vw);height:auto;filter:drop-shadow(0 0 26px rgba(240,230,200,.35))}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.stat{padding:10px 6px;border-radius:12px;border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-ui);font-weight:600;font-size:17px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mist);line-height:1.2;display:block}

/* ---- Oracles ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 14px;min-height:132px;border-radius:var(--r-lg);border:1px solid var(--gold-faint);background:linear-gradient(170deg,rgba(44,27,85,.75),rgba(20,11,43,.8));text-align:left;overflow:hidden;transition:border-color .2s, box-shadow .2s}
.tile:hover{border-color:var(--gold-line);box-shadow:0 0 24px -8px var(--violet-glow)}
.tile.wide{grid-column:1 / -1;padding-right:58px;min-height:auto;flex-direction:row;align-items:center}
.tile .tg{font-size:30px;line-height:1;color:var(--gold);text-shadow:0 0 14px var(--violet-glow);font-family:var(--f-display),var(--f-sym),var(--f-rune)}
.tile .tn{font-family:var(--f-display);font-size:15px;color:var(--gold-hi);letter-spacing:.04em}
.tile .td{font-size:12px;color:var(--mist);line-height:1.35}
.tile .badge{position:absolute;top:10px;right:10px}
.tile.wide .grow{flex:1;min-width:0}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--gold-faint);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.badge.ok{background:rgba(168,232,195,.15);color:var(--ok)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--mist);font-size:14px;min-height:40px;align-self:flex-start}
.back-link svg{width:16px;height:16px}

.num-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rune-stone{width:120px;height:140px;display:grid;place-items:center;border-radius:46% 54% 48% 52% / 50% 46% 54% 50%;background:radial-gradient(circle at 35% 30%,#6b6188,#3a3254 60%,#241d38);box-shadow:inset -8px -10px 18px rgba(0,0,0,.45),inset 6px 6px 14px rgba(255,255,255,.12),0 14px 30px -10px rgba(0,0,0,.6),0 0 40px -10px var(--violet-glow)}
.rune-stone span{font-family:var(--f-rune);font-size:64px;color:var(--gold);text-shadow:0 0 12px rgba(230,195,120,.7),0 1px 0 rgba(0,0,0,.6)}
.pouch{width:120px;height:140px;display:grid;place-items:center;border-radius:40% 40% 46% 46% / 30% 30% 60% 60%;background:radial-gradient(circle at 40% 35%,#5a2f7a,#2a1446 70%);border:1px solid var(--gold-line);box-shadow:0 0 30px -6px var(--violet-glow);font-family:var(--f-rune);font-size:28px;color:var(--gold)}
.gem{width:96px;height:96px;clip-path:polygon(50% 0,92% 30%,78% 100%,22% 100%,8% 30%);box-shadow:none}
.swatch{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold-line);box-shadow:0 0 30px -6px var(--violet-glow)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duo>div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.lucky{font-family:var(--f-display);font-size:44px;color:var(--gold-hi);line-height:1}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.field input{min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--gold-line);background:rgba(10,6,22,.6);font-size:16px;color:var(--ink);width:100%}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,195,120,.2),0 0 18px -4px var(--violet-glow)}
.field .err{font-size:13px;color:var(--danger);min-height:0}
.form{display:flex;flex-direction:column;gap:16px}

.pendulum{width:120px;height:170px;display:block;margin:0 auto;overflow:visible}
.pendulum g{transform-origin:60px 6px}
.pendulum.swing g{animation:swing 0.9s ease-in-out 3 alternate}
@keyframes swing{0%{transform:rotate(-24deg)}100%{transform:rotate(24deg)}}
.answer{font-family:var(--f-display);font-size:34px;letter-spacing:.06em;text-align:center}

.ring{position:relative;width:140px;height:140px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--gold-hi)}

/* ---- Profil ---- */
.id-card{display:flex;align-items:center;gap:16px}
.id-card .glyph-orb{width:76px;height:76px;flex:0 0 76px}
.id-card .glyph-orb span{font-size:36px}
.id-card .who{min-width:0}
.id-card .name{font-family:var(--f-display);font-size:22px;color:var(--gold-hi);overflow-wrap:anywhere}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.backs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.back-opt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.back-opt .mini{position:relative;width:100%;aspect-ratio:7/12;border-radius:8px;overflow:hidden}
.back-opt .mini .face{border-radius:8px}
.back-opt span{font-size:11px;line-height:1.2;color:var(--mist)}
.back-opt[aria-pressed="true"] .mini{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.back-opt[disabled]{cursor:not-allowed}
.back-opt[disabled] .mini::after{content:"Niv. " attr(data-lvl);position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,6,22,.72);color:var(--gold);font-size:12px;font-weight:600}
.journal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.journal button{flex:0 0 58px;display:flex;flex-direction:column;gap:4px;align-items:center}
.journal img{width:58px;aspect-ratio:7/12;border-radius:6px;object-fit:cover;border:1px solid var(--gold-line)}
.journal span{font-size:10px;color:var(--mist);font-variant-numeric:tabular-nums}
.data-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.data-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.data-list li::before{content:"✦";color:var(--gold);font-size:11px;line-height:20px}
.stack{display:flex;flex-direction:column;gap:10px}
.foot{text-align:center;font-size:12px;color:var(--dim);line-height:1.5}

/* ---- Navigation ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(14,8,32,.82),rgba(10,6,22,.96));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--gold-faint)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;min-height:54px;border-radius:14px;color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.04em;transition:color .2s}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--gold-hi)}
.nav a[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--violet-glow)) drop-shadow(0 0 2px rgba(230,195,120,.6))}

/* ---- Fenêtres ---- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow-y:auto;background:rgba(8,5,18,.55)}
.overlay[hidden]{display:none!important}
.onboard{background:transparent}
.onboard .wrap{width:100%;display:flex;flex-direction:column;justify-content:center;min-height:100%;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(5,3,12,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;border-top:1px solid var(--gold-line);background:linear-gradient(180deg,#22134a,#120a2a 60%);box-shadow:0 -20px 60px -20px var(--violet-glow);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:14px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
.grab{width:42px;height:4px;border-radius:4px;background:var(--gold-line);align-self:center}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .big-card{width:min(240px,64vw);aspect-ratio:7/12;align-self:center;border-radius:14px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 40px -6px var(--violet-glow);position:relative}
.sheet .big-card img{width:100%;height:100%;object-fit:cover;display:block}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 14px);z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:linear-gradient(180deg,#2c1b55,#1a0f38);border:1px solid var(--gold);box-shadow:0 10px 30px -8px var(--violet-glow);color:var(--gold-hi);font-weight:500;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);animation:toast 2.4s ease both}
.toast b{font-family:var(--f-display);font-size:16px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}

.breathe{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(8,5,18,.86);padding:24px}
.breathe .orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(251,233,183,.9),rgba(230,195,120,.35) 45%,rgba(167,125,255,.15) 70%,transparent 72%);box-shadow:0 0 60px rgba(167,125,255,.45);animation:breath 8s ease-in-out infinite}
.breathe p{font-family:var(--f-read);font-style:italic;font-size:24px;color:var(--gold-hi);text-align:center;min-height:1.5em}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}

.levelup{text-align:center;align-items:center}

/* ---- Installation ---- */
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.install-banner{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px 14px;align-items:center;padding:14px;border-radius:var(--r-lg);border:1px solid var(--gold-line);background:linear-gradient(120deg,rgba(167,125,255,.22),rgba(28,17,58,.75) 60%);box-shadow:0 0 30px -12px var(--violet-glow)}
.install-banner img,.app-row img{border-radius:22%;box-shadow:0 4px 14px -4px rgba(0,0,0,.6)}
.install-banner .grow,.app-row .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.install-banner b,.app-row b{font-weight:600;font-size:15px;color:var(--gold-hi)}
.ib-actions{grid-column:1 / -1;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.ib-close{width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1;color:var(--mist)}
.app-row{display:flex;align-items:center;gap:14px}
.app-row .grow{flex:1}
.app-icon-lg{border-radius:22%;box-shadow:0 0 0 1px var(--gold-line),0 10px 30px -8px var(--violet-glow)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--gold-faint);background:rgba(28,17,58,.6);font-size:15px;line-height:1.4}
.steps li::before{content:counter(st);width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--gold-line);font-family:var(--f-display);color:var(--gold)}
.foot-icon{border-radius:22%;opacity:.85;margin-bottom:6px}
.levelup .h-title{font-size:28px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .breathe .orb{transform:scale(.9)}
}
@media (min-width:600px){
  .rituals{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

/* Lune : âge depuis la nouvelle lune de référence du 6 janvier 2000 */
const SYNODIC = 29.530588853;
function moonInfo(date = new Date()){
  const ref = Date.UTC(2000, 0, 6, 18, 14);
  const days = (date.getTime() - ref) / 86400000;
  const age = ((days % SYNODIC) + SYNODIC) % SYNODIC;
  const frac = age / SYNODIC;
  const illum = (1 - Math.cos(2 * Math.PI * frac)) / 2;
  const bounds = [1.84, 5.53, 9.23, 12.92, 16.61, 20.3, 23.99, 27.68];
  let idx = bounds.findIndex(b => age < b); if (idx === -1) idx = 0;
  const toFull = age < SYNODIC / 2 ? SYNODIC / 2 - age : SYNODIC * 1.5 - age;
  const toNew = SYNODIC - age;
  return {age, frac, illum, idx, nextFull: new Date(date.getTime() + toFull * 86400000), nextNew: new Date(date.getTime() + toNew * 86400000)};
}
function moonSVG(frac, size = 160){
  const r = 70, cx = 80, cy = 80;
  const k = Math.cos(2 * Math.PI * frac), rx = Math.abs(k * r).toFixed(2);
  let lit;
  if (frac < 0.5) lit = `M${cx} ${cy - r} A${r} ${r} 0 0 1 ${cx} ${cy + r} A${rx} ${r} 0 0 ${k > 0 ? 0 : 1} ${cx} ${cy - r}Z`;
  else lit = `M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r} A${rx} ${r} 0 0 ${k > 0 ? 1 : 0} ${cx} ${cy - r}Z`;
  return `<svg viewBox="0 0 160 160" width="${size}" height="${size}" role="img" aria-label="Phase de la lune">

/* ---------- Effets : ciel étoilé et étincelles ---------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
const fx = $('#fx'), fctx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = [], shooting = null, particles = [], fxRunning = false;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [sky, fx]){ c.width = W * DPR; c.height = H * DPR; }
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const n = Math.round(Math.min(220, W * H / 4200));
  stars = Array.from({length:n}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() < .9 ? Math.random() * 1 + .3 : Math.random() * 1.4 + 1, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4, gold: Math.random() < .18}));
  if (reduceMotion) drawSky(0);
}
function drawSky(t){
  sctx.clearRect(0, 0, W, H);
  for (const st of stars){
    const a = reduceMotion ? .7 : .35 + .65 * (.5 + .5 * Math.sin(t / 1000 * st.s + st.p));
    sctx.globalAlpha = a;
    sctx.fillStyle = st.gold ? '#f5dc9c' : '#e9e2ff';
    sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, 6.283); sctx.fill();
    if (st.r > 1.4){
      sctx.globalAlpha = a * .5; sctx.fillRect(st.x - st.r * 3, st.y - .4, st.r * 6, .8); sctx.fillRect(st.x - .4, st.y - st.r * 3, .8, st.r * 6);
    }
  }
  if (shooting){
    const s = shooting; s.life += 1;
    const x = s.x + s.vx * s.life, y = s.y + s.vy * s.life;
    const g = sctx.createLinearGradient(x, y, x - s.vx * 14, y - s.vy * 14);
    g.addColorStop(0, 'rgba(255,240,200,.9)'); g.addColorStop(1, 'rgba(255,240,200,0)');
    sctx.globalAlpha = Math.max(0, 1 - s.life / 60); sctx.strokeStyle = g; sctx.lineWidth = 1.6;
    sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - s.vx * 14, y - s.vy * 14); sctx.stroke();
    if (s.life > 60) shooting = null;
  } else if (!reduceMotion && Math.random() < .0025){
    shooting = {x: Math.random() * W * .7 + W * .2, y: Math.random() * H * .4, vx: -(4 + Math.random() * 3), vy: 2 + Math.random() * 2, life: 0};
  }
  sctx.globalAlpha = 1;
}
let lastSky = 0;
function skyLoop(t){
  if (!document.hidden && t - lastSky > 33){ drawSky(t); lastSky = t; }
  requestAnimationFrame(skyLoop);
}
function sparkle(x, y, n = 18, spread = 1){
  if (reduceMotion) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, v = (1 + Math.random() * 3.2) * spread;
    particles.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 0, max: 40 + Math.random() * 30, r: 1.5 + Math.random() * 2.5, gold: Math.random() < .7});
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(fxLoop); }
}
function sparkleAt(el, n, spread){ const b = el.getBoundingClientRect(); sparkle(b.left + b.width / 2, b.top + b.height / 2, n, spread); }
function fxLoop(){
  fctx.clearRect(0, 0, W, H);
  particles = particles.filter(p => p.life < p.max);
  for (const p of particles){
    p.life++; p.x += p.vx; p.y += p.vy; p.vx *= .96; p.vy = p.vy * .96 + .04;
    const a = 1 - p.life / p.max, r = p.r * (0.6 + a * .6);
    fctx.globalAlpha = a; fctx.fillStyle = p.gold ? '#fbe2a0' : '#c9a8ff';
    fctx.beginPath();
    fctx.moveTo(p.x, p.y - r * 2); fctx.quadraticCurveTo(p.x, p.y, p.x + r * 2, p.y); fctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r * 2);
    fctx.quadraticCurveTo(p.x, p.y, p.x - r * 2, p.y); fctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r * 2); fctx.fill();
  }
  fctx.globalAlpha = 1;
  if (particles.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fctx.clearRect(0, 0, W, H); }
}

function compatResult(res){
  const me = S.profile, a = birthParts(me.birth), b = birthParts(res.birth);
  const za = ZODIAC[signIndex(a.m, a.d)], zb = ZODIAC[signIndex(b.m, b.d)];
  const key = [za.el, zb.el].sort().join('|'), [base, text] = COMPAT[key];
  const la = lifePath(me.birth), lb = lifePath(res.birth);
  const numBonus = la === lb ? 6 : (reduce9(la) % 2 === reduce9(lb) % 2 ? 3 : -2);
  const jitter = Math.floor(rngFrom([me.birth, res.birth].sort().join('|'))() * 9) - 4;
  const score = Math.max(42, Math.min(98, base + numBonus + jitter));
  const circ = 2 * Math.PI * 60;
  const other = res.name ? esc(res.name) : 'L\'autre personne';
  return `<div class="frame stack" style="align-items:center;text-align:center">
    <div class="ring"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
      <circle cx="70" cy="70" r="60" fill="none" stroke="url(#cg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(circ * score / 100).toFixed(1)} ${circ.toFixed(1)}"/>
      <defs><linearGradient id="cg"><stop offset="0" stop-color="#a77dff"/><stop offset="1" stop-color="#e6c378"/></linearGradient></defs></svg><b>${score}%</b></div>
    <div class="facts"><span class="fact">Vous : ${za.n} ${za.g}${VS} · ${za.el}</span><span class="fact">${other} : ${zb.n} ${zb.g}${VS} · ${zb.el}</span></div>
    <p class="lead" style="margin:0">${esc(text)}</p>
    <div class="small muted">Chemins de vie ${la} et ${lb} : ${la === lb ? 'le même nombre, une compréhension instinctive.' : numBonus > 0 ? 'des rythmes qui s\'accordent bien.' : 'des rythmes différents qui s\'enrichissent l\'un l\'autre.'}</div>
  </div>`;
}

/* ---------- Vue : Profil ---------- */
function vProfil(){
  const p = S.profile, bp = birthParts(p.birth), z = ZODIAC[signIndex(bp.m, bp.d)];
  const lv = levelOf(S.points), next = LEVELS[lv + 1];
  const pct = next ? Math.round((S.points - LEVELS[lv].p) / (next.p - LEVELS[lv].p) * 100) : 100;
  const journal = S.journal.slice(-21).reverse();
  return `<section class="view">
    ${topbar()}
    <div class="frame id-card">
      <div class="glyph-orb"><span>${z.g}${VS}</span></div>
      <div class="who">
        <div class="name">${esc(p.name)}</div>
        <div class="small muted">Naissance : ${fmtBirth.format(fromKey(p.birth))}</div>
        <div class="small muted">${z.n} · ${CHINESE[chineseOf(p.birth).animal].n} · Chemin de vie ${lifePath(p.birth)}</div>
      </div>
    </div>

    <div class="frame-plain levelbar">
      <div class="lv-row"><span class="lv-name">${esc(LEVELS[lv].t)}</span><span class="count">Niveau ${lv + 1} / ${LEVELS.length}</span></div>
      <div class="track"><i style="width:${pct}%"></i></div>
      <div class="small muted">${next ? `${S.points} / ${next.p} points pour devenir ${esc(next.t)}` : `${S.points} points · niveau maximal atteint`}</div>
    </div>
    <div class="stats4">
      <div class="stat"><b>${S.points}</b><span>points</span></div>
      <div class="stat"><b>${S.streak} j</b><span>série actuelle</span></div>
      <div class="stat"><b>${S.best} j</b><span>meilleure série</span></div>
      <div class="stat"><b>${S.rituals}</b><span>rituels accomplis</span></div>
    </div>

    <section class="stack"><div class="section-head"><h2>Dos de cartes</h2><span class="count">Débloqués par niveau</span></div>
      <div class="backs">${BACKS.map(bk => {
        const locked = lv < bk.lvl;
        return `<button class="back-opt" data-act="back" data-id="${bk.id}" aria-pressed="${S.back === bk.id}" ${locked ? `disabled data-lvl="${bk.lvl + 1}"` : ''}>
          <span class="mini" ${locked ? `data-lvl="${bk.lvl + 1}"` : ''}>${backFace(bk.id)}</span><span>${bk.n}</span></button>`;
      }).join('')}</div>
    </section>

    <section class="stack"><div class="section-head"><h2>Journal des cartes</h2><span class="count">${S.journal.length} tirage${S.journal.length > 1 ? 's' : ''}</span></div>
      ${journal.length ? `<div class="journal">${journal.map(j => `<button data-act="card" data-card="${j.id}"><img src="${cardImg(j.id)}" alt="${esc(CARD[j.id].name)}" loading="lazy"><span>${fmtShort.format(fromKey(j.d))}</span></button>`).join('')}</div>`
        : `<p class="small muted" style="margin:0">Vos cartes du jour s'afficheront ici. <a href="#tarot" style="color:var(--gold)">Tirer ma carte du jour</a></p>`}
    </section>

    ${inFrame ? '' : `<section class="stack"><div class="section-head"><h2>Application</h2></div>
      <div class="frame-plain app-row">
        <img src="icons/icon-192.png" alt="" width="56" height="56">
        <div class="grow">${standalone()
          ? `<b>Installée sur cet appareil</b><span class="small muted">Madame Voyance fonctionne aussi sans connexion.</span>`
          : `<b>Écran d'accueil</b><span class="small muted">Installez l'app pour l'ouvrir d'un geste, même hors ligne. +50 points</span>`}</div>
        ${standalone() ? '<span class="badge ok">✓</span>' : `<button class="btn btn-gold btn-sm" data-act="install">${installEvt ? 'Installer' : 'Comment faire'}</button>`}
      </div>
    </section>`}

    <section class="stack"><div class="section-head"><h2>Mes données</h2></div>
      <div class="frame-plain stack">
        <p class="small" style="margin:0">Tout est enregistré uniquement sur cet appareil.${storageOK ? '' : ' <b style="color:var(--danger)">Votre navigateur bloque l\'enregistrement : vos données disparaîtront à la fermeture de la page.</b>'}</p>
        <button class="btn btn-ghost btn-wide" data-act="edit">Modifier mon prénom ou ma date</button>
        <button class="btn btn-ghost btn-wide" data-act="privacy">Revoir l'avertissement</button>
        ${UI.confirmErase
          ? `<div class="stack" style="text-align:center"><p class="small" style="margin:0">Effacer prénom, date, points et journal ? Cette action est définitive.</p>
              <div class="duo"><button class="btn btn-ghost" data-act="erase-no">Annuler</button><button class="btn btn-danger" data-act="erase-yes">Tout effacer</button></div></div>`
          : `<button class="btn btn-danger btn-wide" data-act="erase">Effacer toutes mes données</button>`}
      </div>
    </section>
    <p class="foot"><img src="icons/icon-192.png" alt="" width="40" height="40" class="foot-icon"><br>Madame Voyance est un divertissement. Ses messages ne remplacent pas l'avis d'un professionnel de santé, du droit ou de la finance.<br>Illustrations : tarot Rider-Waite-Smith (1909), domaine public.</p>
  </section>`;
}

/* ---------- Accueil : avertissement et profil ---------- */
const PRIVACY = `
  <div class="h-eyebrow" style="text-align:center">Avant de commencer</div>
  <h1 class="h-title gold" style="text-align:center;margin-bottom:6px">Vos données restent chez vous</h1>
  <p class="small" style="margin:0">Pour vous offrir des tirages personnels, Madame Voyance utilise :</p>
  <ul class="data-list">
    <li><span><b>Votre prénom</b>, pour vous saluer et personnaliser les tirages.</span></li>
    <li><span><b>Votre date de naissance</b>, pour votre signe, votre signe chinois et votre numérologie.</span></li>
    <li><span><b>Vos points, séries et rituels accomplis</b>, pour suivre votre progression.</span></li>
    <li><span><b>Le journal de vos cartes du jour</b> et vos préférences (jeu, dos de carte).</span></li>
  </ul>
  <p class="small" style="margin:0">Tout est enregistré <b>uniquement dans le navigateur de cet appareil</b>. Rien n'est envoyé ni partagé. Les questions posées au pendule et les dates saisies pour la compatibilité ne sont pas conservées.</p>
  <p class="small muted" style="margin:0">Vous pouvez tout effacer à tout moment depuis l'onglet Profil. Madame Voyance est un divertissement : ses messages ne remplacent pas l'avis d'un professionnel.</p>`;

function profileForm(isEdit){
  const p = S.profile || {name:'', birth:''};
  return `<form class="form" data-form="${isEdit ? 'edit' : 'profile'}" novalidate>
    <div class="field"><label for="pn">Votre prénom</label><input id="pn" name="pn" maxlength="30" autocomplete="given-name" value="${esc(p.name)}" placeholder="Votre prénom"><span class="err" id="pn-err"></span></div>
    <div class="field"><label for="pb">Votre date de naissance</label><input id="pb" name="pb" type="date" min="1900-01-01" max="${dk()}" value="${esc(p.birth)}"><span class="err" id="pb-err"></span></div>
    <button class="btn btn-gold btn-wide" type="submit">${isEdit ? 'Enregistrer' : 'Entrer dans le cercle'}</button>
  </form>`;
}
function showOnboarding(step){
  const ov = $('#onboard'), inner = $('#onboard-in');
  $('#app').hidden = true; $('#nav').hidden = true; ov.hidden = false;
  if (step === 1){
    inner.innerHTML = `<div class="frame stack">${PRIVACY}
      ${storageOK ? '' : '<p class="small" style="margin:0;color:var(--danger)">Votre navigateur bloque l\'enregistrement local : l\'application fonctionnera, mais vos données disparaîtront à la fermeture de la page.</p>'}
      <button class="btn btn-gold btn-wide" data-act="consent">J'ai compris</button></div>`;
  } else {
    inner.innerHTML = `<div class="frame stack">
      <div class="h-eyebrow" style="text-align:center">Faisons connaissance</div>
      <h1 class="h-title gold" style="text-align:center">Bienvenue dans le cercle</h1>
      <p class="small muted" style="margin:0;text-align:center">Ces deux informations suffisent à Madame Voyance pour lire vos astres.</p>
      ${profileForm(false)}</div>`;
  }
  ov.scrollTop = 0;
}
function validateProfile(form){
  const name = form.pn.value.trim(), birth = form.pb.value;
  let ok = true;
  $('#pn-err').textContent = ''; $('#pb-err').textContent = '';
  if (!name){ $('#pn-err').textContent = 'Indiquez votre prénom.'; ok = false; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birth) || birth < '1900-01-01' || birth > dk()){ $('#pb-err').textContent = 'Choisissez une date de naissance valide.'; ok = false; }
  return ok ? {name, birth} : null;
}

/* ---------- Fenêtres ---------- */
function openSheet(html){
  $('#sheet-root').innerHTML = `<div class="sheet-back" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}<button class="btn btn-ghost btn-wide" data-act="close">Fermer</button></div></div>`;
}
function closeSheet(){ $('#sheet-root').innerHTML = ''; }
function cardSheet(id){
  const c = CARD[id];
  openSheet(`<div class="big-card"><img src="${cardImg(c.id)}" alt="${esc(c.name)}"></div>
    <div class="daily-read"><div class="pos">${c.major ? 'Arcane ' + c.num : 'Arcane mineur'}</div><div class="cname">${esc(c.name)}</div>
    <div class="keys">${esc(c.keys)}</div><p class="msg" style="margin:4px 0">${esc(c.msg)}</p>
    <div class="tip"><span>✦</span><span>${esc(c.tip)}</span></div><div class="small muted">${esc(c.dom)}</div></div>`);
}
function levelUp(lv){
  const unlock = BACKS.find(b => b.lvl === lv);
  openSheet(`<div class="stack levelup"><div class="glyph-orb"><span class="num">${lv + 1}</span></div>
    <div class="h-eyebrow">Nouveau niveau</div><h2 class="h-title gold">${esc(LEVELS[lv].t)}</h2>
    ${unlock ? `<p class="lead" style="margin:0">Vous débloquez le dos de cartes « ${unlock.n} ». Choisissez-le dans votre profil.</p>` : `<p class="lead" style="margin:0">Les étoiles saluent votre fidélité.</p>`}</div>`);
  setTimeout(() => sparkle(innerWidth / 2, innerHeight * .55, 60, 1.6), 200);
}
function breathe(){
  const el = document.createElement('div'); el.className = 'breathe';
  el.innerHTML = `<div class="orb"></div><p id="bt">Inspirez…</p><button class="btn btn-ghost" id="bstop">Terminer</button>`;
  document.body.appendChild(el);
  let t = 0; const bt = el.querySelector('#bt');
  const iv = setInterval(() => { t++; bt.textContent = t % 2 ? 'Expirez…' : 'Inspirez…'; if (t >= 4) end(); }, 4000);
  function end(){ clearInterval(iv); el.remove(); if (award('pensee')) sparkle(innerWidth / 2, innerHeight * .4, 40, 1.4); render(); }
  el.querySelector('#bstop').addEventListener('click', end);
  el.querySelector('#bstop').focus();
}

async function installApp(){
  if (installEvt){
    const evt = installEvt; installEvt = null;
    try { evt.prompt(); await evt.userChoice; } catch (e) {}
    render(); return;
  }
  const share = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>';
  const steps = isIOS
    ? [`Dans Safari, touchez le bouton Partager ${share} en bas de l'écran.`, 'Faites défiler et choisissez « Sur l\'écran d\'accueil ».', 'Touchez « Ajouter » : l\'icône apparaît avec vos autres apps.']
    : ['Ouvrez le menu du navigateur (les trois points ⋮).', 'Choisissez « Installer l\'application » ou « Ajouter à l\'écran d\'accueil ».', 'Confirmez : l\'icône apparaît avec vos autres apps.'];
  openSheet(`<div class="stack" style="align-items:center;text-align:center">
      <img src="icons/icon-192.png" alt="Icône Madame Voyance" width="88" height="88" class="app-icon-lg">
      <div class="h-eyebrow">Sur votre écran d'accueil</div>
      <h2 class="h-title gold" style="font-size:22px;margin:0">Installer Madame Voyance</h2>
    </div>
    <ol class="steps">${steps.map(t => `<li><span>${t}</span></li>`).join('')}</ol>
    <p class="small muted" style="margin:0;text-align:center">Une fois installée, l'app s'ouvre en plein écran et fonctionne sans connexion. Vous gagnez 50 points à la première ouverture.${isIOS ? ' Sur iPhone, l\'app installée garde ses propres données : vous referez une fois votre profil.' : ''}</p>`);
}

/* ---------- Rendu et navigation ---------- */
function render(){
  if (!S.consent){ showOnboarding(1); return; }
  if (!S.profile){ showOnboarding(2); return; }
  $('#onboard').hidden = true; $('#onboard-in').innerHTML = ''; $('#app').hidden = false; $('#nav').hidden = false;
  const v = UI.view;
  $('#app').innerHTML = v === 'tarot' ? vTarot() : v === 'astres' ? vAstres() : v === 'oracles' ? vOracles() : v === 'profil' ? vProfil() : vAccueil();
  document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
}
function go(view, sub, keepScroll){
  if (view === 'tarot' && sub){ if (UI.tarot !== sub) UI.flips = new Set(); UI.tarot = sub; }
  if (view === 'astres' && sub) UI.astres = sub;
  if (view === 'oracles') UI.oracle = sub || null;
  UI.view = view; UI.confirmErase = false;
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  render(); if (!keepScroll) window.scrollTo(0, 0);
}
function fromHash(){
  const h = location.hash.slice(1);
  if (VIEWS.includes(h) && h !== UI.view){ if (h === 'oracles') UI.oracle = null; UI.view = h; UI.confirmErase = false; render(); window.scrollTo(0, 0); }
}

/* ---------- Actions ---------- */
document.addEventListener('click', e => {
  const navA = e.target.closest('.nav a');
  if (navA && navA.dataset.v === UI.view){ e.preventDefault(); if (UI.view === 'oracles') UI.oracle = null; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act){
    case 'consent': S.consent = true; save(); sparkleAt(el, 24); render(); break;
    case 'go': { const g = JSON.parse(el.dataset.go); go(g[0], g[1]); break; }
    case 'breathe': breathe(); break;
    case 'tmode': UI.flips = new Set(); UI.tarot = +el.dataset.n; render(); break;
    case 'deck':
      if (S.today.draws[UI.tarot]){ toast('Le tirage du jour est déjà fixé'); break; }
      S.deck = el.dataset.deck; UI.flips = new Set(); save(); render(); break;
    case 'flip': {
      const i = +el.dataset.i, n = UI.tarot, id = 'tarot' + n;
      if (el.classList.contains('flipped')){ cardSheet(el.dataset.card); break; }
      UI.flips.add(i); el.classList.add('flipped');
      el.setAttribute('aria-label', CARD[el.dataset.card].name);
      setTimeout(() => sparkleAt(el, 22, 1.1), reduceMotion ? 0 : 380);
      if (UI.flips.size >= n && !isDone(id)){
        const cards = drawSpread(n);
        S.today.draws[n] = cards.map(c => c.id);
        if (n === 1){ S.journal.push({d: dk(), id: cards[0].id}); if (S.journal.length > 120) S.journal = S.journal.slice(-120); }
        award(id);
        setTimeout(() => { render(); const r = document.querySelector('.reading, .daily-read'); if (r) r.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'start'}); }, reduceMotion ? 0 : 1000);
      }
      break;
    }
    case 'card': cardSheet(el.dataset.card); break;
    case 'amode': UI.astres = el.dataset.m; render(); break;
    case 'sign': {
      const i = +el.dataset.i, z = ZODIAC[i];
      openSheet(`<div class="sign-hero"><div class="glyph-orb"><span>${z.g}${VS}</span></div><h2 class="h-title gold" style="font-size:24px">${z.n}</h2><div class="small muted">${z.d} · ${z.el}</div></div>${horoBlock(i)}`);
      break;
    }
    case 'reveal': {
      const id = el.dataset.id, rect = el.getBoundingClientRect();
      if (award(id)) sparkle(rect.left + rect.width / 2, rect.top + rect.height / 2, 34, 1.3);
      render(); break;
    }
    case 'oracle': UI.oracle = el.dataset.id || null; UI.pendulum = null; UI.compat = null; render(); window.scrollTo(0, 0); break;
    case 'back': if (!el.disabled){ S.back = el.dataset.id; save(); render(); } break;
    case 'edit': openSheet(`<div class="h-eyebrow">Mes informations</div>${profileForm(true)}`); break;
    case 'privacy': openSheet(`<div class="stack">${PRIVACY}</div>`); break;
    case 'erase': UI.confirmErase = true; render(); break;
    case 'erase-no': UI.confirmErase = false; render(); break;
    case 'erase-yes':
      try { localStorage.removeItem(KEY); } catch (err) {}
      S = defaultState(); UI.view = 'accueil'; UI.confirmErase = false; history.replaceState(null, '', '#accueil'); render(); break;
    case 'install': installApp(); break;
    case 'install-hide': S.installHide = true; save(); render(); break;
    case 'close': closeSheet(); break;
  }
});

document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'profile' || kind === 'edit'){
    const p = validateProfile(f); if (!p) return;
    const first = !S.profile;
    S.profile = p; save();
    if (kind === 'edit') closeSheet();
    if (first){ sparkle(innerWidth / 2, innerHeight / 2, 60, 1.6); checkIn(); installBonus(); UI.view = 'accueil'; history.replaceState(null, '', '#accueil'); }
    render(); return;
  }
  if (kind === 'pendule'){
    const q = f.q.value.trim();
    if (!q){ $('#q-err').textContent = 'Écrivez une question à laquelle on peut répondre par oui ou non.'; return; }
    const norm = q.toLowerCase().replace(/\s+/g, ' ');
    const r = pick(rngFrom(userKey() + '|' + dk() + '|pendule|' + norm), PENDULUM);
    UI.pendulum = {q, a: r.a, d: r.d, swinging: !reduceMotion};
    render();
    setTimeout(() => {
      if (!UI.pendulum || UI.pendulum.q !== q) return;
      UI.pendulum.swinging = false;
      award('pendule'); render();
      const ans = document.querySelector('.answer'); if (ans) sparkleAt(ans, 30, 1.2);
    }, reduceMotion ? 0 : 2800);
    return;
  }
  if (kind === 'compat'){
    const b = f.cb.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(b) || b < '1900-01-01' || b > dk()){ $('#cb-err').textContent = 'Choisissez une date de naissance valide.'; return; }
    UI.compat = {name: f.cn.value.trim().slice(0, 30), birth: b};
    award('compat'); render();
    const ring = document.querySelector('.ring'); if (ring){ ring.scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'center'}); setTimeout(() => sparkleAt(ring, 34, 1.3), 300); }
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG'){ const f = t.closest('.face'); if (f) f.classList.add('noimg'); else t.style.visibility = 'hidden'; } }, true);
document.addEventListener('pointerdown', e => { if (e.target.closest('.btn, .rit, .tile, .seg button, .signs button')) sparkle(e.clientX, e.clientY, 7, .6); });
window.addEventListener('hashchange', fromHash);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.profile && S.today.d !== dk()){ UI.flips = new Set(); checkIn(); render(); } });
window.addEventListener('resize', resize);

/* ---------- Démarrage ---------- */
$('#nav').innerHTML = `<div class="nav-in">${VIEWS.map(v => `<a href="#${v}" data-v="${v}">${ICONS[v]}<span>${NAV_LABELS[v]}</span></a>`).join('')}</div>`;
resize();
if (!reduceMotion) requestAnimationFrame(skyLoop);
const h0 = location.hash.slice(1);
if (VIEWS.includes(h0)) UI.view = h0;
if (S.consent && S.profile) checkIn();
function installBonus(){ if (standalone() && S.profile && !S.installBonus){ S.installBonus = true; gain(50, 'Application installée'); save(); } }
installBonus();
render();
})();
</script>
</body>
</html>
